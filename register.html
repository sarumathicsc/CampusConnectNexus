<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>Campus Connect Nexus</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
    <a href="resource.html">Resources</a>
    <a href="contact.html">Contact</a>
</nav>

</header>

<section>

<h2>Student Registration Form</h2>

<form id="registerForm">

<label>Student Name</label><br>
<input type="text" id="name" name="name"
placeholder="Enter your name"
required
pattern="[A-Za-z ]{3,30}"
title="Name should contain only letters and spaces (3-30 characters).">
<br><br>

<label>Register Number</label><br>
<input type="text" id="regno" name="regno"
placeholder="Enter Register Number"
required
pattern="[0-9A-Za-z]{8,15}"
title="Register Number should contain 8-15 letters or numbers.">
<br><br>

<label>Email</label><br>
<input type="email" id="email" name="email"
placeholder="Enter Email"
required>
<br><br>

<label>Password</label><br>
<input type="password" id="password" name="password"
placeholder="Enter Password"
required
minlength="8"
maxlength="15"
title="Password must contain 8 to 15 characters.">
<br><br>

<label>Phone Number</label><br>
<input type="tel" id="phone" name="phone"
placeholder="Enter Mobile Number"
required
pattern="[0-9]{10}"
maxlength="10"
title="Enter a valid 10-digit mobile number.">
<br><br>

<label>Date of Birth</label><br>
<input type="date"><br><br>

<label>Department</label><br>

<select id="department">
<option>Select Department</option>
<option>AI & DS</option>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>EEE</option>
<option>MECH</option>
</select>

<br><br>

<label>Gender</label><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female

<br><br>


<label>Upload Student ID</label><br>

<input type="file">

<br><br>

<label>Address</label><br>

<textarea rows="5" cols="40"></textarea>

<br><br>

<input type="submit" value="Register">

<input type="reset" value="Clear">

</form>

</section>

<footer>

<p>© 2026 Campus Connect Nexus | Student Resource Portal</p>

</footer>

<script src="register.js"></script>

</body>
</html>
